nospace" font-size="14" fill="#6f86a6">:</text><text x="218" y="234" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#FFFFFF">Code-Code Fruit (eats bugs for breakfast)</text></g><g class="row" style="animation-delay:1.65s"><text x="48" y="266" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#F5C542">DREAM</text><text x="196" y="266" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#6f86a6">:</text><text x="218" y="266" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#FFFFFF">To become the King of the Coders</text></g><g class="row" style="animation-delay:1.93s"><text x="48" y="298" font-family="'Courier New', Consolas, monospace" font-size="14" font-weight="700" letter-spacing="1.5" fill="#F5C542">MOTTO</text><text x="196" y="298" font-family="'Courier New', Consolas, monospace" font-size="14" fill="#6f86a6">:</text><text x="218" y="298" font-family="Georgia, 'Times New Roman', serif" font-size="18" fill="#FFFFFF">Write code. Chase the dream.</text></g>
