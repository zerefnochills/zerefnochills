<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 580" width="400" height="580" role="img" aria-label="Wanted poster for Deepak Pandey" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <radialGradient id="paper" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#F6E7BC"/>
      <stop offset="65%" stop-color="#E4C78C"/>
      <stop offset="100%" stop-color="#C79F5F"/>
    </radialGradient>
    <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="3" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7"/>
    </filter>
  </defs>

  <!-- Parchment -->
  <rect x="12" y="12" width="376" height="556" rx="6" fill="url(#paper)" stroke="#5A3A1A" stroke-width="5" filter="url(#rough)"/>
  <rect x="26" y="26" width="348" height="528" fill="none" stroke="#5A3A1A" stroke-width="2" stroke-dasharray="3 5" opacity="0.55"/>

  <!-- Nails -->
  <circle cx="34" cy="34" r="4" fill="#5A3A1A"/>
  <circle cx="366" cy="34" r="4" fill="#5A3A1A"/>
  <circle cx="34" cy="546" r="4" fill="#5A3A1A"/>
  <circle cx="366" cy="546" r="4" fill="#5A3A1A"/>

  <!-- Title -->
  <text x="200" y="106" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="82" letter-spacing="4" fill="#3B2412">WANTED</text>

  <!-- Photo frame (swap the hat for your own photo if you like) -->
  <rect x="50" y="128" width="300" height="250" fill="#D9BC82" stroke="#3B2412" stroke-width="6"/>
  <rect x="58" y="136" width="284" height="234" fill="none" stroke="#3B2412" stroke-width="1.5" opacity="0.5"/>

  <!-- Straw hat -->
  <ellipse cx="200" cy="296" rx="112" ry="26" fill="#F2C94C" stroke="#3B2412" stroke-width="4"/>
  <path d="M138 292 Q138 205 200 205 Q262 205 262 292 Z" fill="#F2C94C" stroke="#3B2412" stroke-width="4"/>
  <path d="M139 268 L261 268 L262 290 Q200 306 138 290 Z" fill="#C0392B" stroke="#3B2412" stroke-width="3"/>
  <path d="M120 300 Q200 322 280 300" fill="none" stroke="#B8902B" stroke-width="2" opacity="0.7"/>

  <!-- Text -->
  <text x="200" y="418" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="26" letter-spacing="3" fill="#3B2412">DEAD OR ALIVE</text>
  <text x="200" y="466" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="34" letter-spacing="2" fill="#3B2412">DEEPAK PANDEY</text>
  <text x="200" y="517" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="900" font-size="34" letter-spacing="1" fill="#3B2412">฿ 100,000,000-</text>
  <text x="200" y="543" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="13" fill="#5A3A1A">Bounty grows with every commit</text>
</svg>
