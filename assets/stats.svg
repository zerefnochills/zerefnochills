<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 360" width="860" height="360" role="img" aria-label="GitHub bounty board: followers, repositories, stars, commits, languages and streaks">
<title>Bounty board</title>
<defs>
  <linearGradient id="card" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#14294a"/><stop offset="1" stop-color="#0a1626"/></linearGradient>
</defs>
<style>
.pop{animation:pop .8s cubic-bezier(.2,.8,.2,1) both}
@keyframes pop{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.pulse{animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<g transform="translate(0 0)"><g class="pop" style="animation-delay:0.00s">
  <rect width="170" height="96" rx="14" fill="url(#card)" stroke="#E74C3C" stroke-opacity=".45"/>
  <rect x="14" width="142" height="3" rx="1.5" fill="#E74C3C" opacity=".85"/>
  <rect x="14" width="36" height="3" rx="1.5" fill="#fff" opacity=".85">
    <animate attributeName="x" values="14;120;14" dur="4.5s" repeatCount="indefinite"/></rect>
  <text x="18" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#E74C3C">Crew mates</text>
  <text x="18" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FFFFFF">0</text>
  <text x="18" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="11" fill="#8fa3bd">followers</text>
</g></g><g transform="translate(182 0)"><g class="pop" style="animation-delay:0.08s">
  <rect width="170" height="96" rx="14" fill="url(#card)" stroke="#F5C542" stroke-opacity=".45"/>
  <rect x="14" width="142" height="3" rx="1.5" fill="#F5C542" opacity=".85"/>
  <rect x="14" width="36" height="3" rx="1.5" fill="#fff" opacity=".85">
    <animate attributeName="x" values="14;120;14" dur="4.5s" repeatCount="indefinite"/></rect>
  <text x="18" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#F5C542">Treasure chests</text>
  <text x="18" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FFFFFF">0</text>
  <text x="18" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="11" fill="#8fa3bd">public repositories</text>
</g></g><g transform="translate(364 0)"><g class="pop" style="animation-delay:0.16s">
  <rect width="170" height="96" rx="14" fill="url(#card)" stroke="#FFD36B" stroke-opacity=".45"/>
  <rect x="14" width="142" height="3" rx="1.5" fill="#FFD36B" opacity=".85"/>
  <rect x="14" width="36" height="3" rx="1.5" fill="#fff" opacity=".85">
    <animate attributeName="x" values="14;120;14" dur="4.5s" repeatCount="indefinite"/></rect>
  <text x="18" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#FFD36B">Stars hoarded</text>
  <text x="18" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FFFFFF">0</text>
  <text x="18" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="11" fill="#8fa3bd">stars earned</text>
</g></g><g transform="translate(0 108)"><g class="pop" style="animation-delay:0.24s">
  <rect width="170" height="96" rx="14" fill="url(#card)" stroke="#2ECC71" stroke-opacity=".45"/>
  <rect x="14" width="142" height="3" rx="1.5" fill="#2ECC71" opacity=".85"/>
  <rect x="14" width="36" height="3" rx="1.5" fill="#fff" opacity=".85">
    <animate attributeName="x" values="14;120;14" dur="4.5s" repeatCount="indefinite"/></rect>
  <text x="18" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#2ECC71">Commits</text>
  <text x="18" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FFFFFF">0</text>
  <text x="18" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="11" fill="#8fa3bd">last 12 months</text>
</g></g><g transform="translate(182 108)"><g class="pop" style="animation-delay:0.32s">
  <rect width="170" height="96" rx="14" fill="url(#card)" stroke="#00C2FF" stroke-opacity=".45"/>
  <rect x="14" width="142" height="3" rx="1.5" fill="#00C2FF" opacity=".85"/>
  <rect x="14" width="36" height="3" rx="1.5" fill="#fff" opacity=".85">
    <animate attributeName="x" values="14;120;14" dur="4.5s" repeatCount="indefinite"/></rect>
  <text x="18" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#00C2FF">Pull requests</text>
  <text x="18" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FFFFFF">0</text>
  <text x="18" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="11" fill="#8fa3bd">last 12 months</text>
</g></g><g transform="translate(364 108)"><g class="pop" style="animation-delay:0.40s">
  <rect width="170" height="96" rx="14" fill="url(#card)" stroke="#A06CD5" stroke-opacity=".45"/>
  <rect x="14" width="142" height="3" rx="1.5" fill="#A06CD5" opacity=".85"/>
  <rect x="14" width="36" height="3" rx="1.5" fill="#fff" opacity=".85">
    <animate attributeName="x" values="14;120;14" dur="4.5s" repeatCount="indefinite"/></rect>
  <text x="18" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#A06CD5">Issues</text>
  <text x="18" y="68" font-family="Georgia, 'Times New Roman', serif" font-size="36" font-weight="700" fill="#FFFFFF">0</text>
  <text x="18" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="11" fill="#8fa3bd">last 12 months</text>
</g></g><g transform="translate(558 0)"><g class="pop" style="animation-delay:.55s">
  <rect width="302" height="204" rx="14" fill="url(#card)" stroke="#F5C542" stroke-opacity=".4"/>
  <text x="20" y="30" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#F5C542">Devil Fruit powers</text><text x="151.0" y="112.0" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#8fa3bd">No fruit eaten yet…</text></g></g><g transform="translate(0 228)"><g class="pop" style="animation-delay:.8s">
  <rect width="278" height="132" rx="14" fill="url(#card)" stroke="#E74C3C" stroke-opacity=".5"/>
  <circle cx="68" cy="68" r="38" fill="none" stroke="#1a2e4a" stroke-width="7"/>
  <circle cx="68" cy="68" r="38" fill="none" stroke="#E74C3C" stroke-width="7" stroke-linecap="round"
    stroke-dasharray="238.76" stroke-dashoffset="238.76" transform="rotate(-90 68 68)">
    <animate attributeName="stroke-dashoffset" from="238.76" to="238.8" dur="1.6s" begin=".9s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .8 .2 1"/></circle>
  <text x="68" y="78" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-weight="700" fill="#FFFFFF">0</text>
  <text x="124" y="46" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#E74C3C">Current streak</text>
  <text x="124" y="70" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" fill="#8fa3bd">Hoist the sails and</text>
  <text x="124" y="86" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" fill="#8fa3bd">make a commit today!</text>
  <text x="124" y="112" font-size="18" class="pulse">🔥</text>
</g></g><g transform="translate(291 228)"><g class="pop" style="animation-delay:.95s">
  <rect width="278" height="132" rx="14" fill="url(#card)" stroke="#F5C542" stroke-opacity=".5"/>
  <text x="24" y="34" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#F5C542">Longest streak</text>
  <text x="24" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#FFFFFF">0</text>
  <text x="24" y="112" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" fill="#8fa3bd">days in a row, over the last year</text>
</g></g><g transform="translate(582 228)"><g class="pop" style="animation-delay:1.1s">
  <rect width="278" height="132" rx="14" fill="url(#card)" stroke="#00C2FF" stroke-opacity=".5"/>
  <text x="24" y="34" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" font-weight="700" letter-spacing="1" fill="#00C2FF">Voyage log</text>
  <text x="24" y="86" font-family="Georgia, 'Times New Roman', serif" font-size="50" font-weight="700" fill="#FFFFFF">0</text>
  <text x="24" y="112" font-family="'Segoe UI', 'Trebuchet MS', Verdana, sans-serif" font-size="12" fill="#8fa3bd">contributions in the last 12 months</text>
</g></g>
</svg>