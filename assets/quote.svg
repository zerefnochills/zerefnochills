<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 128" width="900" height="128" role="img" aria-label="“As long as I’m alive, there are infinite chances.” — Monkey D. Luffy">
<title>“As long as I’m alive, there are infinite chances.” — Monkey D. Luffy</title>
<defs><linearGradient id="qbg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14294a"/><stop offset="1" stop-color="#0a1626"/></linearGradient><linearGradient id="qb" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0"><stop offset="0" stop-color="#6b5412"/><stop offset=".5" stop-color="#FFE9A0"/><stop offset="1" stop-color="#6b5412"/><animateTransform attributeName="gradientTransform" type="translate" from="-360 0" to="900 0" dur="5s" begin="0s" repeatCount="indefinite"/></linearGradient><linearGradient id="qt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="420" y2="0"><stop offset="0" stop-color="#FFFFFF"/><stop offset=".5" stop-color="#F5C542"/><stop offset="1" stop-color="#FFFFFF"/><animateTransform attributeName="gradientTransform" type="translate" from="-420 0" to="900 0" dur="6s" begin="0s" repeatCount="indefinite"/></linearGradient></defs>
<style>
